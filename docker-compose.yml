# TrainRideGIS — локальный запуск
# Инфраструктура (Postgres+PostGIS, Redis) + сервисы (api, render-worker, frontend).
# Значения из .env (корень) используются как значения по умолчанию: ${VAR:-default}.
#
# Быстрый старт:
#   cp .env.example .env
#   docker compose up --build

name: trainridegis

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: trainridegis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rail}
      POSTGRES_DB: ${POSTGRES_DB:-railgis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rail} -d ${POSTGRES_DB:-railgis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trainridegis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    container_name: trainridegis-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rail}:${POSTGRES_PASSWORD:-rail}@db:5432/${POSTGRES_DB:-railgis}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TOKEN_TTL_DAYS: 7
      JWT_ALGORITHM: HS256
      SNAP_RADIUS: 0.01
      SIMPLIFY_TOLERANCE: 0.0005
      CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://localhost:3000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app   # hot-reload (uvicorn --reload)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

