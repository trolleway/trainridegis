[project]
name = "trainridegis-api"
version = "0.1.0"
description = "TrainRideGIS API — FastAPI backend (auth, routing, routes CRUD, export)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "shapely>=2",
    "networkx>=3",
    "bcrypt>=4",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2",
    "alembic>=1.13",
    "celery>=5.4.0",
    "redis>=6.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]