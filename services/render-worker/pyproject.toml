[project]
name = "trainridegis-render-worker"
version = "0.1.0"
description = "TrainRideGIS render worker — Celery + PyQGIS render из PostGIS (MVP: мок-PNG)"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.3",
    "redis>=5",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]